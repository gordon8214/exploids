name: Exploids

# Globale XcodeGen-Optionen
options:
  bundleIdPrefix: io.github.danielmuellerir
  deploymentTarget:
    iOS: "17.0"
  # Xcode-Formatversion; 15 ist kompatibel mit Xcode 15+
  xcodeVersion: "15"

# Lokales SwiftPM-Package eine Ebene über ios/ (= Repo-Root)
packages:
  GameCore:
    path: ".."

# Das einzige App-Target
targets:
  Exploids:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # Quellverzeichnis (alle .swift-Dateien und Assets darunter)
    sources:
      - path: Exploids

    # Abhängigkeit: GameCore aus dem lokalen SwiftPM-Package
    dependencies:
      - package: GameCore
        product: GameCore

    # Gemeinsames Scheme erzeugen, damit `xcodebuild -scheme Exploids` headless/CI baut
    # (ohne Scheme resolvt der reine `-target`-Build das lokale SwiftPM-Package nicht sauber).
    scheme: {}

    # Xcode übernimmt nicht jeden beliebigen INFOPLIST_KEY_* in seine automatisch erzeugte Plist.
    # XcodeGen schreibt deshalb diese deklarative Quelle als echte Info.plist aus.
    info:
      path: Exploids/Info.plist
      properties:
        CFBundleDisplayName: Exploids
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Auf ProMotion-iPhones Bildraten oberhalb des 60-Hz-Systemdefaults freigeben.
        CADisableMinimumFrameDurationOnPhone: true
        # Leerer schwarzer Launch-Screen ohne separates Storyboard.
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

    # Build-Einstellungen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.danielmuellerir.exploids
        # Wird von ios/generate.sh automatisch aus der VERSION-Datei im Repo-Root
        # nachgezogen — Projekt immer über `bash ios/generate.sh` generieren,
        # nicht über `xcodegen generate` direkt (sonst driftet die Version).
        MARKETING_VERSION: "0.16.3"
        CURRENT_PROJECT_VERSION: 1

        # App-Icon aus dem Asset-Catalog
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

        # Swift 6 – strikte Concurrency
        SWIFT_VERSION: "6.0"

        # iPhone (1) und iPad (2) unterstützen
        TARGETED_DEVICE_FAMILY: "1,2"

        # Code Signing: automatisch über das Apple-Developer-Team. Die Team-ID ist dieselbe
        # wie bei der macOS-Signierung (vgl. wrappers/sign-and-release.sh) und in Xcode unter
        # "Signing & Capabilities" jederzeit überschreibbar. Damit lässt sich die App direkt
        # auf ein angeschlossenes iPhone/iPad bauen (Gerätebuilds werden signiert).
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 9QSWKSR4NQ
        # Reine Simulator-Builds (Headless-Check/CI) brauchen keine Signatur – nur dort
        # abschalten; Gerätebuilds (SDK iphoneos) werden automatisch signiert.
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
